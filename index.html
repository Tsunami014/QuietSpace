<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuietSpace</title>
    <style>
* { font-family: sans-serif; }
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
}
canvas, #playerContainer > svg, #fselout {
    display: block;
    position: absolute;
}
#fselout {
    background-color: white;
    width: 100vw;
    height: 100vh;
}
#fsel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: left top;
}
#fsel svg { overflow: visible; }
.txt {
    position: absolute;
    transform: translate(0, -50%);
    padding: 5%;
    width: 90%;
    text-align: center;
    font-weight: bold;
}
.circle {
    position: absolute;
    left: calc(50vw - 5px);
    top: calc(50vh - 5px);
    z-index: 1;
    height: 10px;
    width: 10px;
    background-color: blue;
    border-radius: 50%;
}
    </style>
</head>
<body>
    <canvas id="canvas1">
        If you can read this, you can't see the beautiful game I made! Sad.
    </canvas>
    <div id="playerContainer"></div>
    <canvas id="canvas2"></canvas>
    <!--div class="circle"></div-->
    <script src="src/main.js"></script>
    <div id="fselout"><div id="fsel"></div></div>
</body>
