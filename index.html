<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuietSpace</title>
    <style>
* { font-family: sans-serif; }
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
}
canvas, #playerContainer > svg, #fselout, img, .popwrap {
    display: block;
    position: absolute;
}
#fselout {
    background-color: #CCC8;
    width: 100vw;
    height: 100vh;
}
#fsel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    transform-origin: left top;
}
#fsel svg { overflow: visible; }
.txt {
    position: absolute;
    transform: translate(0, -50%);
    padding: 7.5%;
    width: 85%;
    text-align: center;
    font-weight: bold;
}
input {
    margin-left: 7.5%;
    padding: 0.5% !important;
    top: 15%;
    background: #FFF5;
    border-radius: 15%;
    border: none;
    border-bottom: gray 5px solid;
}
.imgbtn:hover {
    rotate: -1deg;
}
.imgbtn {
    transition: rotate 0.3s ease;
    rotate: 3deg;
    cursor: pointer;
    width: 100%;
}
.marks {
    position: absolute;
    translate: 0 -15%;
    z-index: -1;
    display: flex;
    flex-direction: row;
    gap: 5%;
    margin-left: 3%;
}
.marks > * {
    cursor: pointer;
    transition: translate 0.1s ease;
    user-select: none;
}
.marks > *:hover { translate: 0 -12%; }
#nowmarks {
    position: absolute;
    transform: translate(50%);
    right: 53%;
    top: -15%;
    user-select: none;
}
.circle {
    position: absolute;
    left: calc(50vw - 5px);
    top: calc(50vh - 5px);
    z-index: 1;
    height: 10px;
    width: 10px;
    background-color: blue;
    border-radius: 50%;
}
.hidden {
    display: none;
    position: absolute;
    width: 0;
    height: 0;
}
.popwrap .popcont {
    position: absolute;
    bottom: 125%;
    left: 45%;
    text-align: center;
    width: 120%;
    transform: translateX(-50%);
    background-color: #333;
    color: #fff;
    padding: 8px 12px;
    border-radius: 4px;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.2s ease, transform 0.2s ease;
}
.popcont, .popcont + * {
    user-select: none;
}
.popcont:has(+ *:hover) {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
}
    </style>
</head>
<body>
    <canvas id="canvas1">
        If you can read this, you can't see the beautiful game I made! Sad.
    </canvas>
    <div id="playerContainer"></div>
    <canvas id="canvas2"></canvas>
    <!--div class="circle"></div-->
    <script src="src/main.js"></script>
    <div id="fselout" style="display: none"><div id="fsel"></div></div>
</body>
